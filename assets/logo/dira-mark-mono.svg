<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="dira">
  <title>dira</title>
  <!-- currentColor variant. The needle's south half is cut out with a mask
       rather than filled with a paper colour, so the mark sits correctly on any
       background instead of stamping a light wedge onto a dark one. -->
  <defs>
    <mask id="southCut">
      <rect width="96" height="96" fill="#fff"/>
      <g transform="rotate(34 48 48)"><path d="M48 51 L53.2 51 L48 74 L42.8 51 Z" fill="#000"/></g>
    </mask>
  </defs>
  <g fill="currentColor">
    <circle cx="48" cy="48" r="33" fill="none" stroke="currentColor" stroke-width="5.5"/>
    <g transform="rotate(34 48 48)" mask="url(#southCut)">
      <path d="M48 18 L56 48 L48 78 L40 48 Z"/>
    </g>
  </g>
</svg>
